<div class="page active" id="signup">
    <div class="auth-layout">
        <div class="auth-card">
            <div class="navbar-brand" onclick="app.router.navigate('/landing')" style="margin-bottom: 24px; cursor: pointer;">
                <svg width="30" height="30" viewBox="0 0 100 100" style="vertical-align:middle;margin-right:8px;flex-shrink:0;">
                    <path d="M85.45 43.75 A36 36 0 1 1 56.25 14.55" fill="none" stroke="#4F46E5" stroke-width="11" stroke-linecap="round"/>
                    <path d="M30 58 L46 74 L83.7 21.72" fill="none" stroke="#4F46E5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="46" cy="74" r="4" fill="#2DD4BF"/>
                </svg>
                <span>Streako</span>
            </div>

            <h2>Create your account</h2>

            <!-- Error Message Display -->
            <div id="signup-error" class="error-message" style="display: none; background: #fee; color: #c00; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px;"></div>

            <!-- Success Message Display -->
            <div id="signup-success" style="display: none; background: #efe; color: #0a0; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px;"></div>

            <!-- Signup Form -->
            <form id="signup-form" style="width: 100%;">
                <input 
                    type="text" 
                    id="signup-fullname" 
                    class="input-field" 
                    placeholder="Full name"
                    required
                >
                <input 
                    type="email" 
                    id="signup-email" 
                    class="input-field" 
                    placeholder="Email address"
                    required
                >
                <input 
                    type="password" 
                    id="signup-password" 
                    class="input-field" 
                    placeholder="Password (min 6 characters)"
                    required
                >
                <input 
                    type="password" 
                    id="signup-confirm-password" 
                    class="input-field" 
                    placeholder="Confirm password"
                    required
                >

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    id="signup-btn"
                    style="width: 100%; margin-bottom: 16px;">
                    Sign Up
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <span class="link" onclick="app.router.navigate('/login')">Log in</span>
            </div>
        </div>
    </div>
</div>
