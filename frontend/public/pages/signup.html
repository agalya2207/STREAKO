<div class="page active" id="signup">
    <div class="auth-layout">
        <div class="auth-card">
            <div class="sidebar-logo" onclick="app.router.navigate('/landing')" style="margin-bottom: 28px; cursor: pointer; justify-content: center; border-bottom: none; height: auto; min-height: auto; padding: 0;">
                <div class="sidebar-logo-icon" style="width: 44px; height: 44px;">
                    <img src="/assets/images/logo.png" alt="STREAKO Logo" style="width: 44px; height: 44px; object-fit: contain; mix-blend-mode: screen;">
                </div>
                <div class="sidebar-logo-text">
                    <span class="sidebar-logo-title" style="font-size: 22px; font-weight: 800; letter-spacing: 1.5px;">STREAKO</span>
                    <span class="sidebar-logo-sub" style="font-size: 9px; letter-spacing: 2px;">PREMIUM PRODUCTIVITY</span>
                </div>
            </div>

            <h2>Create your account</h2>

            <!-- Error Message Display -->
            <div id="signup-error" class="error-message" style="display: none; background: #fee; color: #c00; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px;"></div>

            <!-- Success Message Display -->
            <div id="signup-success" style="display: none; background: #efe; color: #0a0; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px;"></div>

            <!-- Signup Form -->
            <form id="signup-form" style="width: 100%;">
                <input 
                    type="text" 
                    id="signup-fullname" 
                    class="input-field" 
                    placeholder="Full name"
                    required
                >
                <input 
                    type="email" 
                    id="signup-email" 
                    class="input-field" 
                    placeholder="Email address"
                    required
                >
                <input 
                    type="password" 
                    id="signup-password" 
                    class="input-field" 
                    placeholder="Password (min 6 characters)"
                    required
                >
                <input 
                    type="password" 
                    id="signup-confirm-password" 
                    class="input-field" 
                    placeholder="Confirm password"
                    required
                >

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    id="signup-btn"
                    style="width: 100%; margin-bottom: 16px;">
                    Sign Up
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <span class="link" onclick="app.router.navigate('/login')">Log in</span>
            </div>
        </div>
    </div>
</div>
