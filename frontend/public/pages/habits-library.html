<!-- ═══════════════════════════════════════════════════
     MODAL OVERLAY  ─  covers the full viewport, blurs bg
     overflow:hidden stops the overlay itself from scrolling
     padding:16px keeps the modal off screen edges on small displays
════════════════════════════════════════════════════════ -->
<div id="habit-modal-overlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    overflow: hidden;
    padding: 16px;
    box-sizing: border-box;
">

  <!-- ═══════════════════════════════════════════════
       MODAL BOX  ─  flex column so header/footer pin
       max-height: 90vh  →  never taller than viewport
       overflow: hidden  →  children handle their own scroll
  ════════════════════════════════════════════════════ -->
  <div id="habit-modal" style="
      background: #1a1e2b;
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      color: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      overflow: hidden;
  ">

    <!-- ── HEADER (pinned, never scrolls) ── -->
    <div id="habit-modal-header" style="
        flex-shrink: 0;
        padding: 18px 20px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.09);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #1a1e2b;
    ">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.3px;">Define New Routine</h2>
      <button
        onclick="window.closeHabitModal()"
        style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #a0aec0; font-size: 15px; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0;"
        onmouseover="this.style.background='rgba(239,68,68,0.18)'; this.style.color='#ef4444';"
        onmouseout="this.style.background='rgba(255,255,255,0.06)'; this.style.color='#a0aec0';"
      >&#x2715;</button>
    </div>

    <!-- ── BODY (scrolls when content overflows) ── -->
    <div id="habit-modal-body" style="
        flex: 1 1 auto;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scrollbar-width: thin;
        scrollbar-color: #4F46E5 #111;
    ">

      <!-- Habit Name -->
      <div>
        <label style="display:block; margin-bottom:5px; font-weight:600; font-size:13px; color:#cbd5e0;">Habit Name</label>
        <input id="habit-name" type="text" placeholder="e.g. Wake up early, Read 15 mins"
          style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid #374151; background:#0d1117; color:#fff; font-size:14px; box-sizing:border-box;" />
      </div>

      <!-- Description -->
      <div>
        <label style="display:block; margin-bottom:5px; font-weight:600; font-size:13px; color:#cbd5e0;">Description</label>
        <textarea id="habit-desc" placeholder="Add a context description..." rows="3"
          style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid #374151; background:#0d1117; color:#fff; font-size:14px; resize:vertical; box-sizing:border-box;"></textarea>
      </div>

      <!-- Category + Daily Target -->
      <div style="display:flex; gap:12px;">
        <div style="flex:1;">
          <label style="display:block; margin-bottom:5px; font-weight:600; font-size:13px; color:#cbd5e0;">Category</label>
          <select id="habit-category"
            style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid #374151; background:#0d1117; color:#fff; font-size:14px; box-sizing:border-box;">
            <option>Health</option><option>Fitness</option><option>Learning</option><option>Career</option><option>Personal</option><option>Mindfulness</option>
          </select>
        </div>
        <div style="width:110px;">
          <label style="display:block; margin-bottom:5px; font-weight:600; font-size:13px; color:#cbd5e0;">Daily Target</label>
          <input id="habit-target" type="number" min="1" value="1"
            style="width:100%; padding:9px 10px; border-radius:8px; border:1px solid #374151; background:#0d1117; color:#fff; font-size:14px; box-sizing:border-box;" />
        </div>
      </div>

      <!-- Dynamic session rows injected by renderSessionFields() -->
      <div id="habit-sessions-container" style="display:flex; flex-direction:column; gap:8px;"></div>

      <!-- Icon picker -->
      <div>
        <label style="display:block; margin-bottom:6px; font-weight:600; font-size:13px; color:#cbd5e0;">Icon</label>
        <div id="icon-picker" style="display:flex; gap:6px; flex-wrap:wrap;">
          <button data-icon="&#x2600;&#xFE0F;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x2600;&#xFE0F;</button>
          <button data-icon="&#x1F4AA;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x1F4AA;</button>
          <button data-icon="&#x1F4DA;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x1F4DA;</button>
          <button data-icon="&#x1F9ED;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x1F9ED;</button>
          <button data-icon="&#x1F4A7;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x1F4A7;</button>
          <button data-icon="&#x1F4BC;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x1F4BC;</button>
          <button data-icon="&#x1F3F7;&#xFE0F;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x1F3F7;&#xFE0F;</button>
          <button data-icon="&#x2615;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x2615;</button>
          <button data-icon="&#x2705;" class="icon-btn" style="font-size:18px; background:transparent; border:1px solid transparent; border-radius:6px; cursor:pointer; padding:4px 6px;">&#x2705;</button>
        </div>
      </div>

      <!-- Accent Color -->
      <div>
        <label style="display:block; margin-bottom:6px; font-weight:600; font-size:13px; color:#cbd5e0;">Accent Color</label>
        <div id="color-picker" style="display:flex; gap:8px; flex-wrap:wrap;">
          <button data-color="#4F46E5" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#4F46E5; border:2px solid transparent; cursor:pointer;"></button>
          <button data-color="#EF4444" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#EF4444; border:2px solid transparent; cursor:pointer;"></button>
          <button data-color="#00D9FF" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#00D9FF; border:2px solid transparent; cursor:pointer;"></button>
          <button data-color="#FBBF24" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#FBBF24; border:2px solid transparent; cursor:pointer;"></button>
          <button data-color="#A78BFA" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#A78BFA; border:2px solid transparent; cursor:pointer;"></button>
          <button data-color="#EC4899" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#EC4899; border:2px solid transparent; cursor:pointer;"></button>
          <button data-color="#14B8A6" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#14B8A6; border:2px solid transparent; cursor:pointer;"></button>
          <button data-color="#F97316" class="color-swatch" style="width:26px; height:26px; border-radius:50%; background:#F97316; border:2px solid transparent; cursor:pointer;"></button>
        </div>
      </div>

      <!-- Frequency -->
      <div>
        <label style="display:block; margin-bottom:6px; font-weight:600; font-size:13px; color:#cbd5e0;">Frequency</label>
        <div style="display:flex; gap:8px;">
          <button id="freq-everyday" class="freq-btn" data-value="Daily"
            style="flex:1; padding:8px; border-radius:8px; border:1px solid #555; background:#111; color:#fff; font-size:13px; cursor:pointer;">Everyday</button>
          <button id="freq-weekdays" class="freq-btn" data-value="Weekdays"
            style="flex:1; padding:8px; border-radius:8px; border:1px solid #555; background:#111; color:#fff; font-size:13px; cursor:pointer;">Specific Weekdays</button>
        </div>
        <div id="weekday-container" style="display:none; margin-top:8px; gap:4px; flex-wrap:wrap;">
          <button class="weekday-btn" data-day="Mon" style="padding:4px 10px; border-radius:6px; background:#111; color:#fff; border:1px solid #555; cursor:pointer; font-size:13px;">Mon</button>
          <button class="weekday-btn" data-day="Tue" style="padding:4px 10px; border-radius:6px; background:#111; color:#fff; border:1px solid #555; cursor:pointer; font-size:13px;">Tue</button>
          <button class="weekday-btn" data-day="Wed" style="padding:4px 10px; border-radius:6px; background:#111; color:#fff; border:1px solid #555; cursor:pointer; font-size:13px;">Wed</button>
          <button class="weekday-btn" data-day="Thu" style="padding:4px 10px; border-radius:6px; background:#111; color:#fff; border:1px solid #555; cursor:pointer; font-size:13px;">Thu</button>
          <button class="weekday-btn" data-day="Fri" style="padding:4px 10px; border-radius:6px; background:#111; color:#fff; border:1px solid #555; cursor:pointer; font-size:13px;">Fri</button>
          <button class="weekday-btn" data-day="Sat" style="padding:4px 10px; border-radius:6px; background:#111; color:#fff; border:1px solid #555; cursor:pointer; font-size:13px;">Sat</button>
          <button class="weekday-btn" data-day="Sun" style="padding:4px 10px; border-radius:6px; background:#111; color:#fff; border:1px solid #555; cursor:pointer; font-size:13px;">Sun</button>
        </div>
      </div>

    </div><!-- /#habit-modal-body -->

    <!-- ── FOOTER (pinned, never scrolls) ── -->
    <div id="habit-modal-footer" style="
        flex-shrink: 0;
        padding: 14px 20px;
        border-top: 1px solid rgba(255,255,255,0.09);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        background: #1a1e2b;
    ">
      <button
        onclick="window.closeHabitModal()"
        style="background: transparent; border:1px solid #4a5568; color:#a0aec0; padding:8px 20px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; transition: all 0.2s;"
        onmouseover="this.style.background='rgba(255,255,255,0.06)'"
        onmouseout="this.style.background='transparent'"
      >Cancel</button>
      <button
        id="create-habit-btn"
        onclick="window.createHabit()"
        style="background: linear-gradient(135deg, #4F46E5, #7C3AED); border:none; color:#fff; padding:8px 20px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:700; transition: opacity 0.2s;"
        onmouseover="this.style.opacity='0.88'"
        onmouseout="this.style.opacity='1'"
      >Create Routine</button>
    </div>

  </div><!-- /#habit-modal -->
</div><!-- /#habit-modal-overlay -->

<button class="btn btn-primary" onclick="window.openCreateHabitModal()">+ Create Habit</button>
            <div id="habit-modal-container"></div>
            </div>

            <div style="display: flex; gap: 12px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px;">
                <div class="tag tag-primary" style="background: var(--primary); color: white; cursor: pointer;">All</div>
                <div class="tag tag-primary" style="cursor: pointer;">&#x1F3CB;&#xFE0F; Fitness</div>
                <div class="tag tag-primary" style="cursor: pointer;">&#x1F9E0; Learning</div>
                <div class="tag tag-primary" style="cursor: pointer;">&#x1F4BC; Career</div>
                <div class="tag tag-primary" style="cursor: pointer;">&#x1F49A; Health</div>
                <div class="tag tag-primary" style="cursor: pointer;">&#x270D;&#xFE0F; Personal</div>
                <div class="tag tag-primary" style="cursor: pointer;">&#x1F9D8; Mindfulness</div>
            </div>

            <div class="habits-grid">
                <!-- Dynamically populated by renderHabits() in main.js -->
            </div>
        </div>
    </div>
</div>
