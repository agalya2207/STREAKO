    <div class="sidebar-layout">

                <div class="nav-item active" onclick="app.router.navigate('/calendar')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                    <span>Calendar</span>
                </div>
                <div class="nav-item " onclick="app.router.navigate('/goals')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>

                </div>
                <div class="nav-item " onclick="app.router.navigate('/analytics')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>

            <div class="sidebar-profile">
                <div class="profile-avatar" id="sidebar-avatar">AG</div>
                <div class="profile-info" onclick="app.router.navigate('/settings')">
                    <p id="sidebar-name">User</p>
                    <p id="sidebar-email">user@email.com</p>
                </div>
                <button class="profile-action-btn" onclick="window.logout()" title="Log Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content" style="padding: 32px 36px; background: #07080a; min-height: 100vh;">
            <!-- Page Title Header matching reference screenshot -->
            <div style="margin-bottom: 24px;">
                <h1 style="font-size: 28px; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; margin: 0 0 6px 0;">Productivity Calendar</h1>
                <p style="font-size: 14px; color: #94a3b8; margin: 0;">Review historical scores, habits completed, and journal reflections by day.</p>
            </div>

            <div style="display: flex; gap: 24px; align-items: start;">
                <!-- Main Calendar Grid Container (Left) -->
                <div style="flex: 1; background: #0d0e14; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px;">
                    <!-- Month & Year Navigation Header -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <h2 id="calendar-month-year" style="font-size: 20px; font-weight: 700; color: #ffffff; margin: 0;">August 2026</h2>
                        <div style="display: flex; gap: 8px;">
                            <button onclick="window.prevCalendarMonth()" style="width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='rgba(255,255,255,0.04)'">‹</button>
                            <button onclick="window.nextCalendarMonth()" style="width: 34px; height: 34px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='rgba(255,255,255,0.04)'">›</button>
                        </div>
                    </div>

                    <!-- Weekdays Header Row -->
                    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 12px; text-align: center;">
                        <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em;">SUN</div>
                        <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em;">MON</div>
                        <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em;">TUE</div>
                        <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em;">WED</div>
                        <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em;">THU</div>
                        <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em;">FRI</div>
                        <div style="font-size: 12px; font-weight: 700; color: #64748b; letter-spacing: 0.05em;">SAT</div>
                    </div>

                    <!-- Days Grid Container -->
                    <div id="calendar-days-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;">
                        <!-- Dynamically populated by window.renderCalendar() -->
                    </div>
                </div>

                <!-- Right Sidebar Panel: Daily Summary -->
                <div style="width: 360px; background: #0d0e14; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; min-height: 540px; display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                        <div>
                            <h2 style="font-size: 16.5px; font-weight: 700; color: #ffffff; margin: 0 0 3px 0;">Daily Summary</h2>
                            <p id="summary-date-label" style="font-size: 13px; color: #94a3b8; margin: 0;">Wednesday, 5 Aug</p>
                        </div>
                    </div>

                    <!-- Daily Summary Details injected by window.renderDailySummary() -->
                    <div id="calendar-daily-summary-content" style="display: flex; flex-direction: column; gap: 20px;">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
