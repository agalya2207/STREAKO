<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streako - Keep Your Streak Alive</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --ink:#161a2e;
  --mute:#6b7280;
  --acc:#10b981;
  --acc2:#059669;
  --chip:#fff;
  --line:#bfead6;
  --tint:#e6f8ef;
  --text-acc:#047857;
  --flame-start:#f59e0b;
  --flame-end:#ef4444;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#06130d;
    --ink:#ecfdf5;
    --mute:#9bb7a9;
    --chip:#0d2118;
    --line:#1f4d3a;
    --tint:#0f2a1f;
    --text-acc:#34d399;
  }
}
:root[data-theme="dark"]{
  --bg:#06130d;
  --ink:#ecfdf5;
  --mute:#9bb7a9;
  --chip:#0d2118;
  --line:#1f4d3a;
  --tint:#0f2a1f;
  --text-acc:#34d399;
}

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:430px;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:18px 20px 26px;
  position:relative;
  overflow:hidden;
  background:radial-gradient(90% 45% at 50% 12%,#d1f5e4,transparent 70%),linear-gradient(180deg,#ffffff 0%,#ecfaf3 55%,#d6f4e5 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .app{
    background:radial-gradient(90% 45% at 50% 12%,#0f3a2a,transparent 70%),#06130d;
  }
}
:root[data-theme="dark"] .app{
  background:radial-gradient(90% 45% at 50% 12%,#0f3a2a,transparent 70%),#06130d;
}

/* Header bar */
.topbar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
}
.back-btn{
  border:0;
  background:none;
  color:var(--mute);
  display:inline-flex;
  align-items:center;
  gap:4px;
  font:600 15px Inter;
  padding:8px 6px;
  cursor:pointer;
  transition:color .2s;
}
.back-btn:hover{color:var(--ink)}
.back-btn svg{width:18px;height:18px}

.skip{
  border:0;
  background:none;
  color:var(--mute);
  font:500 17px Inter;
  padding:8px 6px;
  cursor:pointer;
  transition:color .2s;
}
.skip:hover{color:var(--ink)}

/* Hero Section */
.hero{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:0;
  width:100%;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(245,158,11,0.15);
  border:1px solid rgba(245,158,11,0.3);
  color:#d97706;
  font:700 12px Inter;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:6px 14px;
  border-radius:99px;
  margin-bottom:14px;
}
:root[data-theme="dark"] .badge,
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .badge{
    color:#fbbf24;
    background:rgba(245,158,11,0.2);
  }
}

h1{
  font-size:32px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:-.8px;
  text-align:center;
}
h1 em{
  display:block;
  font-style:normal;
  background:linear-gradient(90deg,#059669,#10b981);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-top:4px;
}

.sub{
  color:var(--mute);
  font-size:15px;
  line-height:1.45;
  margin-top:10px;
  text-align:center;
  max-width:320px;
}

/* ═══ STREAK VISUAL SHOWCASE CARD ═══ */
.streak-card-wrap{
  width:100%;
  max-width:360px;
  margin-top:24px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.streak-hero-card{
  background:var(--chip);
  border-radius:24px;
  padding:20px;
  border:1.5px solid var(--line);
  box-shadow:0 12px 30px rgba(16,185,129,0.12);
  position:relative;
  overflow:hidden;
  transition:transform .25s ease, box-shadow .25s ease;
}
.streak-hero-card:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 36px rgba(16,185,129,0.18);
}

.streak-card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.streak-counter-box{
  display:flex;
  align-items:center;
  gap:12px;
}
.flame-circle{
  width:52px;
  height:52px;
  border-radius:18px;
  background:linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
  display:grid;
  place-items:center;
  box-shadow:0 8px 18px rgba(239,68,68,0.38);
  animation:flamePulse 2s ease-in-out infinite;
}
@keyframes flamePulse{
  0%,100%{transform:scale(1);box-shadow:0 8px 18px rgba(239,68,68,0.38)}
  50%{transform:scale(1.06);box-shadow:0 10px 24px rgba(245,158,11,0.55)}
}
.flame-circle svg{width:28px;height:28px}

.streak-num{
  font-family:'Unbounded',Inter,sans-serif;
  font-size:24px;
  font-weight:800;
  color:var(--ink);
  line-height:1;
}
.streak-label{
  font-size:13px;
  font-weight:600;
  color:var(--text-acc);
  margin-top:4px;
}

.streak-badge-pill{
  font-size:12px;
  font-weight:700;
  padding:5px 10px;
  border-radius:99px;
  background:rgba(16,185,129,0.12);
  color:var(--text-acc);
  border:1px solid rgba(16,185,129,0.25);
  display:flex;
  align-items:center;
  gap:4px;
}

/* 7-Day Chain */
.week-chain{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  position:relative;
  padding:0 4px;
}
.week-chain::before{
  content:'';
  position:absolute;
  top:16px;
  left:22px;
  right:22px;
  height:3px;
  background:var(--line);
  z-index:1;
}
.day-node{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}
.day-bubble{
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--chip);
  border:2px solid var(--line);
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
  color:var(--mute);
  transition:all .2s;
}
.day-node.done .day-bubble{
  background:linear-gradient(135deg,#10b981,#059669);
  border-color:transparent;
  color:#fff;
  box-shadow:0 4px 10px rgba(16,185,129,.35);
}
.day-node.today .day-bubble{
  background:linear-gradient(135deg,#f59e0b,#ef4444);
  border-color:#fff;
  color:#fff;
  box-shadow:0 4px 12px rgba(245,158,11,.45);
  transform:scale(1.12);
}
.day-bubble svg{width:16px;height:16px}
.day-name{
  font-size:11px;
  font-weight:600;
  color:var(--mute);
}
.day-node.today .day-name{
  color:var(--text-acc);
  font-weight:800;
}

/* Mini highlight pills */
.features-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.feat-chip{
  background:var(--chip);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:0 4px 14px rgba(0,0,0,0.02);
}
.feat-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.feat-icon svg{width:18px;height:18px}
.feat-text{
  font-size:12px;
  font-weight:600;
  line-height:1.3;
  color:var(--ink);
}

/* ═══ BUTTONS & DOTS ═══ */
.go{
  width:100%;
  height:56px;
  border:0;
  border-radius:99px;
  background:linear-gradient(90deg,#34d399,#10b981);
  color:#fff;
  font:800 17px Inter;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(16,185,129,.4);
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .2s;
}
.go:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(16,185,129,.48);
}
.go:active{transform:scale(.98)}

.dots{display:flex;gap:8px;margin-top:24px}
.dot{
  width:12px;
  height:12px;
  border-radius:99px;
  background:var(--line);
  transition:all .3s ease;
}
/* PAGE 2: 2nd dot is active! */
.dot.on{
  width:44px;
  background:linear-gradient(90deg,#34d399,#10b981);
}

:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}

@media (max-height:760px){
  h1{font-size:27px}.sub{font-size:14px;margin-top:6px}
  .streak-card-wrap{margin-top:16px;gap:8px}
  .streak-hero-card{padding:16px}
  .flame-circle{width:46px;height:46px}
  .streak-num{font-size:22px}
  .go{height:52px}.dots{margin-top:16px}
}
</style>
</head>
<body>
<div class="app">
  <!-- Top Bar: Back & Skip -->
  <div class="topbar">
    <button class="back-btn" onclick="goBack()" aria-label="Go to previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      Back
    </button>
    <button class="skip" onclick="finish()">Skip</button>
  </div>

  <div class="hero">
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>
      </svg>
      Streak Momentum
    </div>

    <h1>Never Break the<em>Chain</em></h1>
    <p class="sub">Watch your streaks multiply day by day. Every small action builds unstoppable momentum.</p>

    <!-- Visual Showcase: Interactive Streak Card -->
    <div class="streak-card-wrap">
      <div class="streak-hero-card">
        <div class="streak-card-top">
          <div class="streak-counter-box">
            <div class="flame-circle">
              <svg viewBox="0 0 24 24" fill="#ffffff">
                <path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>
              </svg>
            </div>
            <div>
              <div class="streak-num">14 Days</div>
              <div class="streak-label">🔥 On Fire! Best: 28d</div>
            </div>
          </div>
          <div class="streak-badge-pill">
            <span>⚡ Top 5%</span>
          </div>
        </div>

        <!-- 7-day chain row -->
        <div class="week-chain">
          <div class="day-node done">
            <div class="day-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="day-name">M</span>
          </div>

          <div class="day-node done">
            <div class="day-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="day-name">T</span>
          </div>

          <div class="day-node done">
            <div class="day-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="day-name">W</span>
          </div>

          <div class="day-node done">
            <div class="day-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="day-name">T</span>
          </div>

          <div class="day-node done">
            <div class="day-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="day-name">F</span>
          </div>

          <div class="day-node done">
            <div class="day-bubble">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="day-name">S</span>
          </div>

          <div class="day-node today">
            <div class="day-bubble">
              <svg viewBox="0 0 24 24" fill="#ffffff">
                <path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/>
              </svg>
            </div>
            <span class="day-name">SUN</span>
          </div>
        </div>
      </div>

      <!-- Feature Chips Row -->
      <div class="features-row">
        <div class="feat-chip">
          <div class="feat-icon" style="background:#eff6ff;color:#3b82f6">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div class="feat-text">Streak Freeze Protection</div>
        </div>

        <div class="feat-chip">
          <div class="feat-icon" style="background:#fef3c7;color:#d97706">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="7"/>
              <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
            </svg>
          </div>
          <div class="feat-text">Milestone Badges</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Continue button -->
  <button class="go" onclick="nextPage()">
    <span>Continue</span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </button>

  <!-- Dots: 2nd Dot is Active -->
  <div class="dots" aria-hidden="true">
    <i class="dot" onclick="goBack()" style="cursor:pointer" title="Page 1"></i>
    <i class="dot on" title="Page 2"></i>
    <i class="dot" onclick="nextPage()" style="cursor:pointer" title="Page 3"></i>
  </div>
</div>

<script>
// Routes configuration
var NEXT_URL = "/login"; // or your 3rd onboarding page
var PREV_URL = "/";      // previous page

function goBack(){
  if(window.history.length > 1){
    window.history.back();
  } else {
    location.href = PREV_URL;
  }
}

function nextPage(){
  // If you have a 3rd page, redirect here; otherwise to NEXT_URL
  location.href = NEXT_URL;
}

function finish(){
  try{ localStorage.setItem("streako_onboarded", "1"); }catch(e){}
  location.href = NEXT_URL;
}
</script>
</body>
</html>
