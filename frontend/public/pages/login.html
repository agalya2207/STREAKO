<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – STREAKO</title>
<meta name="description" content="Log in to STREAKO and continue building your best habits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #c8edd9 0%, #e4f7ed 40%, #f0faf4 100%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0;
    margin: 0;
  }
  .auth-shell {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: transparent;
  }
  @media (min-width: 480px) {
    body {
      padding: 24px 16px;
      align-items: center;
    }
    .auth-shell {
      min-height: auto;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      background: linear-gradient(180deg, #c8edd9 0%, #e4f7ed 40%, #ffffff 100%);
    }
  }
  .auth-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px 16px;
  }
  .logo-icon {
    width: 72px;
    height: 72px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .logo-wordmark {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #1a9e6e;
    margin-bottom: 12px;
  }
  .auth-title {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    text-align: center;
    line-height: 1.25;
  }
  .auth-title span { color: #1a9e6e; }
  .auth-subtitle {
    font-size: 13px;
    color: #6b7280;
    text-align: center;
    margin-top: 6px;
    line-height: 1.45;
    max-width: 280px;
  }
  .auth-card {
    flex: 1;
    width: 100%;
    background: #ffffff;
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 32px;
    box-shadow: 0 -6px 30px rgba(0,0,0,0.04);
    margin-top: 8px;
    display: flex;
    flex-direction: column;
  }
  .auth-alert {
    display: none;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 16px;
    text-align: center;
  }
  .auth-alert.error   { background: rgba(239,68,68,0.10); color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
  .auth-alert.success { background: rgba(26,158,110,0.10); color: #1a9e6e; border: 1px solid rgba(26,158,110,0.3); }

  .field-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .field-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #1a9e6e;
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  .auth-input {
    width: 100%;
    padding: 14px 46px 14px 48px;
    border: 1.5px solid #e5e7eb;
    border-radius: 50px;
    font-size: 14px;
    font-family: inherit;
    color: #111827;
    background: #ffffff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .auth-input::placeholder { color: #9ca3af; }
  .auth-input:focus {
    border-color: #1a9e6e;
    box-shadow: 0 0 0 3px rgba(26,158,110,0.12);
  }
  .pw-toggle {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #9ca3af;
    display: flex;
    align-items: center;
    padding: 4px;
    transition: color 0.2s;
  }
  .pw-toggle:hover { color: #1a9e6e; }

  .forgot-link {
    display: block;
    text-align: right;
    font-size: 13px;
    font-weight: 600;
    color: #1a9e6e;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    margin-top: 4px;
    margin-bottom: 16px;
    transition: color 0.2s;
  }
  .forgot-link:hover { color: #138a5d; text-decoration: underline; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #1a9e6e 0%, #25c272 100%);
    color: #fff;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 18px rgba(26,158,110,0.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(26,158,110,0.45); }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary .btn-inner { display: flex; align-items: center; justify-content: center; gap: 8px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: #9ca3af;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }

  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    background: #fff;
    border: 1.5px solid #e5e7eb;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    color: #111827;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .btn-google:hover { background: #f9fafb; border-color: #d1d5db; }

  .auth-footer-link {
    text-align: center;
    font-size: 13px;
    color: #6b7280;
    margin-top: 20px;
  }
  .auth-footer-link button {
    background: none;
    border: none;
    font-family: inherit;
    font-size: inherit;
    font-weight: 700;
    color: #1a9e6e;
    cursor: pointer;
    padding: 0;
    transition: color 0.2s;
  }
  .auth-footer-link button:hover { color: #138a5d; text-decoration: underline; }

  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="auth-shell" id="login-shell">

  <div class="auth-header">
    <div class="logo-icon">
      <svg viewBox="12 12 396 396" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <path d="M285 117.5 H170 A46.25 46.25 0 0 0 170 210 H250 A46.25 46.25 0 0 1 250 302.5 H135"
              fill="none" stroke="#0E9F6E" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M285 117.5 H170 A46.25 46.25 0 0 0 170 210 H250 A46.25 46.25 0 0 1 250 302.5 H135"
              fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="none" stroke="#0E9F6E" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10">
          <path d="M135 95 L210 20 L285 95 Z"/>
          <path d="M135 325 L210 400 L285 325 Z"/>
          <path d="M255 280 H90 L20 210 L90 140"/>
          <path d="M165 140 H330 L400 210 L330 280"/>
        </g>
      </svg>
    </div>
    <div class="logo-wordmark">STREAKO</div>
    <h1 class="auth-title">Welcome <span>back</span></h1>
    <p class="auth-subtitle">Log in to pick your streak up where you<br>left it.</p>
  </div>

  <div class="auth-card">
    <div id="login-alert" class="auth-alert" role="alert"></div>

    <form id="login-form" autocomplete="on" novalidate>
      <!-- Email -->
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </span>
        <input type="email" id="login-email" name="email" class="auth-input" placeholder="Email address" autocomplete="email" required>
      </div>

      <!-- Password -->
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="login-password" name="password" class="auth-input" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="login-pw-toggle" aria-label="Toggle password visibility">
          <svg id="login-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <!-- Forgot password -->
      <button type="button" class="forgot-link" id="login-forgot-btn">Forgot password?</button>

      <!-- Log in button -->
      <button type="submit" class="btn-primary" id="login-submit-btn">
        <div class="btn-inner">
          <span id="login-btn-text">Log in</span>
          <div class="spinner" id="login-spinner"></div>
        </div>
      </button>
    </form>

    <div class="divider">OR</div>

    <button class="btn-google" id="login-google-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M47.5 24.5c0-1.6-.1-3.2-.4-4.7H24.5v9h13a11.1 11.1 0 0 1-4.8 7.3v6h7.7c4.5-4.2 7.1-10.3 7.1-17.6z"/><path fill="#34A853" d="M24.5 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.4-5 2.3-8.2 2.3-6.3 0-11.6-4.2-13.5-10H3v6.2C6.9 43.1 15.1 48 24.5 48z"/><path fill="#FBBC05" d="M11 28.5a14.4 14.4 0 0 1 0-9v-6.2H3a24.1 24.1 0 0 0 0 21.4L11 28.5z"/><path fill="#EA4335" d="M24.5 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C36.4 2.4 31 0 24.5 0 15.1 0 6.9 4.9 3 12.3l8 6.2c1.9-5.8 7.2-9 13.5-9z"/></svg>
      Continue with Google
    </button>

    <p class="auth-footer-link">
      New to STREAKO? <button onclick="app&&app.router?app.router.navigate('/signup'):window.location.href='/signup'">Create an account</button>
    </p>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ── Password Toggle ── */
  const pwInput = document.getElementById('login-password');
  document.getElementById('login-pw-toggle')?.addEventListener('click', function() {
    const hidden = pwInput.type === 'password';
    pwInput.type = hidden ? 'text' : 'password';
    document.getElementById('login-eye-icon').innerHTML = hidden
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  /* ── Forgot Password ── */
  document.getElementById('login-forgot-btn')?.addEventListener('click', function() {
    const emailVal = document.getElementById('login-email');
    if (emailVal && emailVal.value.trim()) sessionStorage.setItem('streako_forgot_email', emailVal.value.trim());
    if (window.app && window.app.router) window.app.router.navigate('/forgot-password');
    else window.location.href = '/forgot-password';
  });

  /* ── Alert helpers ── */
  function showAlert(msg, type) {
    const el = document.getElementById('login-alert');
    if (!el) return;
    el.textContent = msg;
    el.className = 'auth-alert ' + (type || 'error');
    el.style.display = 'block';
  }
  function hideAlert() {
    const el = document.getElementById('login-alert');
    if (el) el.style.display = 'none';
  }
  function setLoading(loading) {
    const btn = document.getElementById('login-submit-btn');
    const txt = document.getElementById('login-btn-text');
    const spn = document.getElementById('login-spinner');
    if (!btn) return;
    btn.disabled = loading;
    if (txt) txt.style.display = loading ? 'none' : 'inline';
    if (spn) spn.style.display = loading ? 'block' : 'none';
  }

  async function authApiRequest(endpoint, options) {
    let res = null, fallbackNeeded = false;
    try {
      res = await fetch(endpoint, options);
      const cType = res.headers.get('content-type') || '';
      if ((!res.ok || cType.includes('text/html')) && endpoint.startsWith('/api')) fallbackNeeded = true;
    } catch (e) { fallbackNeeded = true; }
    if (fallbackNeeded && (location.hostname === 'localhost' || location.hostname === '127.0.0.1'))
      return await fetch('http://localhost:5000' + endpoint, options);
    return res;
  }

  /* ── Login Form Submit ── */
  document.getElementById('login-form')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideAlert();
    const email    = (document.getElementById('login-email')?.value || '').trim();
    const password = (document.getElementById('login-password')?.value || '').trim();
    if (!email || !password) return showAlert('Please enter your email and password.', 'error');
    setLoading(true);
    try {
      const res = await authApiRequest('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { showAlert(data.error || 'Login failed. Please check your credentials.', 'error'); setLoading(false); return; }
      if (data.session) {
        if (data.session.access_token)  localStorage.setItem('access_token', data.session.access_token);
        if (data.session.access_token)  localStorage.setItem('streako_auth_token', data.session.access_token);
        if (data.session.refresh_token) localStorage.setItem('refresh_token', data.session.refresh_token);
        if (data.session.expires_at)    localStorage.setItem('expires_at', data.session.expires_at);
      }
      if (data.user) {
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('streako_user', JSON.stringify(data.user));
        if (data.user.id)    localStorage.setItem('user_id', data.user.id);
        if (data.user.email) localStorage.setItem('user_email', data.user.email);
      }
      showAlert('Login successful! Redirecting…', 'success');
      setTimeout(function() {
        if (window.app && window.app.router) window.app.router.navigate('/dashboard');
        else window.location.href = '/dashboard';
      }, 600);
    } catch (err) {
      showAlert(err.message || 'Network error. Please try again.', 'error');
      setLoading(false);
    }
  });

  document.getElementById('login-google-btn')?.addEventListener('click', function() {
    if (window.app && window.app.signInWithGoogle) window.app.signInWithGoogle();
    else window.location.href = '/api/auth/google';
  });
})();
</script>
</body>
</html>
