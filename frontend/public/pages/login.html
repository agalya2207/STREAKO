<div class="page active" id="login">
    <div class="auth-layout">
        <div class="auth-card">
            <div class="navbar-brand" onclick="app.router.navigate('/landing')" style="margin-bottom: 24px; cursor: pointer;">
                <svg width="30" height="30" viewBox="0 0 100 100" style="vertical-align:middle;margin-right:8px;flex-shrink:0;">
                    <path d="M85.45 43.75 A36 36 0 1 1 56.25 14.55" fill="none" stroke="#4F46E5" stroke-width="11" stroke-linecap="round"/>
                    <path d="M30 58 L46 74 L83.7 21.72" fill="none" stroke="#4F46E5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="46" cy="74" r="4" fill="#2DD4BF"/>
                </svg>
                <span>Streako</span>
            </div>

            <h2>Welcome back</h2>

            <!-- Error Message Display -->
            <div id="login-error" class="error-message" style="display: none; background: #fee; color: #c00; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px;"></div>

            <!-- Login Form -->
            <form id="login-form" style="width: 100%;">
                <input 
                    type="email" 
                    id="login-email" 
                    class="input-field" 
                    placeholder="Email address"
                    required
                >
                <input 
                    type="password" 
                    id="login-password" 
                    class="input-field" 
                    placeholder="Password"
                    required
                >
                <div style="text-align: right; margin-bottom: 24px;">
                    <span class="link" style="cursor: pointer;">Forgot password?</span>
                </div>

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    id="login-btn"
                    style="width: 100%; margin-bottom: 16px;"
                 onclick="window.showNotification('Coming soon!', 'info')">
                    Log In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <span class="link" onclick="app.router.navigate('/signup')">Sign up</span>
            </div>
        </div>
    </div>
</div>

<script>
// Login Form Handler
document.getElementById('login-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorDiv = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    // Clear previous errors
    errorDiv.style.display = 'none';
    errorDiv.textContent = '';

    // Validation
    if (!email || !password) {
        errorDiv.textContent = 'Email and password are required';
        errorDiv.style.display = 'block';
        return;
    }

    // Show loading state
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    try {
        // Call backend API
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Login failed');
        }

        // Store tokens in localStorage
        localStorage.setItem('access_token', data.session.access_token);
        localStorage.setItem('refresh_token', data.session.refresh_token);
        localStorage.setItem('user_id', data.user.id);
        localStorage.setItem('user_email', data.user.email);
        localStorage.setItem('expires_at', data.session.expires_at);

        // Show success and redirect
        errorDiv.style.display = 'none';
        loginBtn.textContent = '✓ Login successful';
        
        // Redirect to dashboard after 500ms
        setTimeout(() => {
            if (window.app && window.app.router) {
                window.app.router.navigate('/dashboard');
            } else {
                window.location.href = '/dashboard';
            }
        }, 500);

    } catch (error) {
        console.error('Login error:', error);
        errorDiv.textContent = error.message || 'Login failed. Please try again.';
        errorDiv.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
    }
});

// Check if already logged in - redirect to dashboard
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('access_token');
    if (token && document.getElementById('login')) {
        // User is already logged in, redirect to dashboard
        if (window.app && window.app.router) {
            window.app.router.navigate('/dashboard');
        }
    }
});
</script>
