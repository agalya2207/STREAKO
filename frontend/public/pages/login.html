<div class="page active" id="login">
    <div class="auth-layout">
        <div class="auth-card">
            <div class="sidebar-logo" onclick="app.router.navigate('/landing')" style="margin-bottom: 28px; cursor: pointer; justify-content: center; border-bottom: none; height: auto; min-height: auto; padding: 0;">
                <div class="sidebar-logo-icon" style="width: 44px; height: 44px;">
                    <img src="/assets/images/logo.png" alt="STREAKO Logo" style="width: 44px; height: 44px; object-fit: contain; mix-blend-mode: screen;">
                </div>
                <div class="sidebar-logo-text">
                    <span class="sidebar-logo-title" style="font-size: 22px; font-weight: 800; letter-spacing: 1.5px;">STREAKO</span>
                    <span class="sidebar-logo-sub" style="font-size: 9px; letter-spacing: 2px;">PREMIUM PRODUCTIVITY</span>
                </div>
            </div>

            <h2>Welcome back</h2>

            <!-- Error Message Display -->
            <div id="login-error" class="error-message" style="display: none; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; text-align: center; font-weight: 500;"></div>


            <!-- Login Form -->
            <form id="login-form" style="width: 100%;">
                <input 
                    type="email" 
                    id="login-email" 
                    class="input-field" 
                    placeholder="Email address"
                    required
                >
                <input 
                    type="password" 
                    id="login-password" 
                    class="input-field" 
                    placeholder="Password"
                    required
                >
                <div style="text-align: right; margin-bottom: 24px;">
                    <span class="link" style="cursor: pointer;">Forgot password?</span>
                </div>

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    id="login-btn"
                    style="width: 100%; margin-bottom: 16px;">
                    Log In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <span class="link" onclick="app.router.navigate('/signup')">Sign up</span>
            </div>
        </div>
    </div>
</div>
