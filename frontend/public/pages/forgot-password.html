<div class="page active" id="forgot-password">
    <div class="auth-layout">
        <div class="auth-card">
            <!-- STREAKO Logo Header -->
            <div class="sidebar-logo" onclick="app.router.navigate('/login')" role="button" tabindex="0" style="margin-bottom: 24px; cursor: pointer; justify-content: center; border-bottom: none; height: auto; min-height: auto; padding: 0;">
                <div class="sidebar-logo-icon" style="width: 44px; height: 44px;">
                    <img src="/assets/images/logo.png" alt="STREAKO Logo" style="width: 44px; height: 44px; object-fit: contain; mix-blend-mode: screen;">
                </div>
                <div class="sidebar-logo-text">
                    <span class="sidebar-logo-title" style="font-size: 22px; font-weight: 800; letter-spacing: 1.5px;">STREAKO</span>
                    <span class="sidebar-logo-sub" style="font-size: 9px; letter-spacing: 2px;">PREMIUM PRODUCTIVITY</span>
                </div>
            </div>

            <h2 style="margin-bottom: 8px; font-size: 26px; text-align: center;">Reset Password</h2>
            <p id="forgot-subtitle" style="text-align: center; color: var(--text-muted, #94a3b8); font-size: 14px; margin-bottom: 24px; line-height: 1.5;">
                Enter your account email to receive a password reset code in your inbox.
            </p>

            <!-- Error Banner -->
            <div id="forgot-error" class="error-message" style="display: none; background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; text-align: center; font-weight: 500;"></div>

            <!-- Success Banner -->
            <div id="forgot-success" style="display: none; background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; text-align: center; font-weight: 500;"></div>

            <!-- STEP 1: REQUEST CODE FORM -->
            <form id="forgot-step1-form" style="width: 100%;">
                <div style="margin-bottom: 18px;">
                    <label for="forgot-email" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary, #cbd5e1); margin-bottom: 6px;">Email address</label>
                    <input 
                        type="email" 
                        id="forgot-email" 
                        class="input-field" 
                        placeholder="Enter your registered email"
                        required
                        autocomplete="email"
                        style="width: 100%; box-sizing: border-box;"
                    >
                </div>

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    id="forgot-send-btn"
                    style="width: 100%; margin-bottom: 16px; padding: 12px; font-weight: 600; font-size: 15px;">
                    Send Reset Code
                </button>
            </form>

            <!-- STEP 2: VERIFY CODE & NEW PASSWORD FORM (revealed after step 1) -->
            <form id="forgot-step2-form" style="width: 100%; display: none;">


                <div style="margin-bottom: 16px;">
                    <label for="forgot-code" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary, #cbd5e1); margin-bottom: 6px;">Verification Code</label>
                    <input 
                        type="text" 
                        id="forgot-code" 
                        class="input-field" 
                        placeholder="Enter code from your email"
                        required
                        autocomplete="one-time-code"
                        style="width: 100%; box-sizing: border-box; font-size: 15px; letter-spacing: 1px;"
                    >
                </div>

                <div style="margin-bottom: 14px;">
                    <label for="forgot-new-password" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary, #cbd5e1); margin-bottom: 6px;">New Password</label>
                    <input 
                        type="password" 
                        id="forgot-new-password" 
                        class="input-field" 
                        placeholder="At least 6 characters"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        style="width: 100%; box-sizing: border-box;"
                    >
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="forgot-confirm-password" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary, #cbd5e1); margin-bottom: 6px;">Confirm New Password</label>
                    <input 
                        type="password" 
                        id="forgot-confirm-password" 
                        class="input-field" 
                        placeholder="Re-enter new password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                        style="width: 100%; box-sizing: border-box;"
                    >
                </div>

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    id="forgot-submit-btn"
                    style="width: 100%; margin-bottom: 14px; padding: 12px; font-weight: 600; font-size: 15px;">
                    Update Password
                </button>

                <div style="text-align: center; margin-bottom: 6px;">
                    <button type="button" id="forgot-resend-btn" style="background: none; border: none; color: #60a5fa; cursor: pointer; font-size: 13px; text-decoration: underline;">
                        Resend Code or Change Email
                    </button>
                </div>
            </form>

            <div class="auth-footer" style="margin-top: 18px; text-align: center;">
                Remember your password? <span class="link" onclick="app.router.navigate('/login')" style="cursor: pointer; color: var(--primary, #3b82f6); font-weight: 500;">Back to Log In</span>
            </div>
        </div>
    </div>
</div>
