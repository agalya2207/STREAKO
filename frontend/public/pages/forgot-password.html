<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password – STREAKO</title>
<meta name="description" content="Reset your STREAKO password and get back to your streak.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #c8edd9 0%, #e4f7ed 40%, #f0faf4 100%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0;
    margin: 0;
  }
  .auth-shell {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: transparent;
  }
  @media (min-width: 480px) {
    body {
      padding: 24px 16px;
      align-items: center;
    }
    .auth-shell {
      min-height: auto;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      background: linear-gradient(180deg, #c8edd9 0%, #e4f7ed 40%, #ffffff 100%);
    }
  }
  .auth-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px 16px;
    position: relative;
  }
  .back-btn {
    position: absolute;
    left: 16px;
    top: 28px;
    width: 36px;
    height: 36px;
    border-radius: 12px;
    border: 1.5px solid rgba(26,158,110,0.25);
    background: rgba(255,255,255,0.8);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #374151;
    transition: background 0.2s, border-color 0.2s;
    font-family: inherit;
  }
  .back-btn:hover { background: #fff; border-color: #1a9e6e; }
  .logo-icon {
    width: 72px;
    height: 72px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .logo-wordmark {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #1a9e6e;
    margin-bottom: 12px;
  }
  .auth-title {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    text-align: center;
    line-height: 1.25;
  }
  .auth-title span { color: #1a9e6e; }
  .auth-subtitle {
    font-size: 13px;
    color: #6b7280;
    text-align: center;
    margin-top: 6px;
    line-height: 1.45;
    max-width: 280px;
  }
  .auth-card {
    flex: 1;
    width: 100%;
    background: #ffffff;
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 32px;
    box-shadow: 0 -6px 30px rgba(0,0,0,0.04);
    margin-top: 8px;
    display: flex;
    flex-direction: column;
  }
  .auth-alert {
    display: none;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 16px;
    text-align: center;
  }
  .auth-alert.error   { background: rgba(239,68,68,0.10); color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }
  .auth-alert.success { background: rgba(26,158,110,0.10); color: #1a9e6e; border: 1px solid rgba(26,158,110,0.3); }

  .info-box {
    background: #f9fafb;
    border: 1.5px solid #e5e7eb;
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 13px;
    color: #374151;
    line-height: 1.55;
    margin-bottom: 18px;
  }

  .field-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .field-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #1a9e6e;
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  .auth-input {
    width: 100%;
    padding: 14px 46px 14px 48px;
    border: 1.5px solid #e5e7eb;
    border-radius: 50px;
    font-size: 14px;
    font-family: inherit;
    color: #111827;
    background: #ffffff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .auth-input::placeholder { color: #9ca3af; }
  .auth-input:focus {
    border-color: #1a9e6e;
    box-shadow: 0 0 0 3px rgba(26,158,110,0.12);
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #1a9e6e 0%, #25c272 100%);
    color: #fff;
    margin-top: 4px;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 18px rgba(26,158,110,0.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(26,158,110,0.45); }
  .btn-primary:active:not(:disabled) { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary .btn-inner { display: flex; align-items: center; justify-content: center; gap: 8px; }

  .btn-secondary {
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    border: 1.5px solid #d1fae5;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: #ffffff;
    color: #1a9e6e;
    margin-top: 14px;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-secondary:hover { background: #f0fdf4; border-color: #6ee7b7; }

  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Step 2 hidden by default */
  #forgot-step2 { display: none; }

  /* Step 2 label style */
  .field-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 7px;
    padding-left: 4px;
  }
</style>
</head>
<body>
<div class="auth-shell" id="forgot-shell">

  <div class="auth-header">
    <button class="back-btn" id="back-btn" aria-label="Go back"
      onclick="app&&app.router?app.router.navigate('/login'):window.location.href='/login'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div class="logo-icon">
      <svg viewBox="12 12 396 396" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <path d="M285 117.5 H170 A46.25 46.25 0 0 0 170 210 H250 A46.25 46.25 0 0 1 250 302.5 H135"
              fill="none" stroke="#0E9F6E" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M285 117.5 H170 A46.25 46.25 0 0 0 170 210 H250 A46.25 46.25 0 0 1 250 302.5 H135"
              fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="none" stroke="#0E9F6E" stroke-width="6" stroke-linejoin="miter" stroke-miterlimit="10">
          <path d="M135 95 L210 20 L285 95 Z"/>
          <path d="M135 325 L210 400 L285 325 Z"/>
          <path d="M255 280 H90 L20 210 L90 140"/>
          <path d="M165 140 H330 L400 210 L330 280"/>
        </g>
      </svg>
    </div>
    <div class="logo-wordmark">STREAKO</div>
    <h1 class="auth-title">Forgot <span>password?</span></h1>
    <p class="auth-subtitle">No problem. We will help you get back in.</p>
  </div>

  <div class="auth-card">
    <div id="forgot-alert" class="auth-alert" role="alert"></div>

    <!-- STEP 1: Request reset link -->
    <div id="forgot-step1">
      <div class="info-box">
        Enter the email you signed up with. We will send you a link to set a new password.
      </div>

      <form id="forgot-step1-form" autocomplete="on" novalidate>
        <div class="field-wrap">
          <span class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" id="forgot-email" name="email" class="auth-input" placeholder="Email address" autocomplete="email" required>
        </div>

        <button type="submit" class="btn-primary" id="forgot-send-btn">
          <div class="btn-inner">
            <span id="forgot-send-text">Send reset link</span>
            <div class="spinner" id="forgot-spinner"></div>
          </div>
        </button>
      </form>

      <button class="btn-secondary" type="button"
        onclick="app&&app.router?app.router.navigate('/login'):window.location.href='/login'">
        Back to log in
      </button>
    </div>

    <!-- STEP 2: Verify code + new password -->
    <div id="forgot-step2">
      <form id="forgot-step2-form" autocomplete="off" novalidate>
        <div class="field-wrap">
          <label class="field-label" for="forgot-code">Verification Code</label>
          <input type="text" id="forgot-code" class="auth-input" placeholder="Enter code from your email"
            required autocomplete="one-time-code"
            style="padding-left:20px;letter-spacing:1.5px;font-size:15px;">
        </div>
        <div class="field-wrap">
          <label class="field-label" for="forgot-new-password">New Password</label>
          <input type="password" id="forgot-new-password" class="auth-input" placeholder="At least 6 characters"
            required minlength="6" autocomplete="new-password" style="padding-left:20px;">
        </div>
        <div class="field-wrap">
          <label class="field-label" for="forgot-confirm-password">Confirm Password</label>
          <input type="password" id="forgot-confirm-password" class="auth-input" placeholder="Re-enter new password"
            required minlength="6" autocomplete="new-password" style="padding-left:20px;">
        </div>
        <button type="submit" class="btn-primary" id="forgot-submit-btn">
          <div class="btn-inner">
            <span id="forgot-submit-text">Update Password</span>
            <div class="spinner" id="forgot-submit-spinner"></div>
          </div>
        </button>
      </form>
      <button type="button" class="btn-secondary" id="forgot-resend-btn">Resend Code or Change Email</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  /* ── Pre-fill email if saved ── */
  const savedEmail = sessionStorage.getItem('streako_forgot_email');
  if (savedEmail) {
    const emailInput = document.getElementById('forgot-email');
    if (emailInput) emailInput.value = savedEmail;
  }

  function showAlert(msg, type) {
    const el = document.getElementById('forgot-alert');
    if (!el) return;
    el.textContent = msg;
    el.className = 'auth-alert ' + (type || 'error');
    el.style.display = 'block';
  }
  function hideAlert() {
    const el = document.getElementById('forgot-alert');
    if (el) el.style.display = 'none';
  }

  function setLoading(btnId, spinnerId, txtId, loading) {
    const btn = document.getElementById(btnId);
    const spn = document.getElementById(spinnerId);
    const txt = document.getElementById(txtId);
    if (!btn) return;
    btn.disabled = loading;
    if (spn) spn.style.display = loading ? 'block' : 'none';
    if (txt) txt.style.display = loading ? 'none' : 'inline';
  }

  async function authApiRequest(endpoint, options) {
    let res = null, fallbackNeeded = false;
    try {
      res = await fetch(endpoint, options);
      const cType = res.headers.get('content-type') || '';
      if ((!res.ok || cType.includes('text/html')) && endpoint.startsWith('/api')) fallbackNeeded = true;
    } catch (e) { fallbackNeeded = true; }
    if (fallbackNeeded && (location.hostname === 'localhost' || location.hostname === '127.0.0.1'))
      return await fetch('http://localhost:5000' + endpoint, options);
    return res;
  }

  /* ── Step 1: Send reset link ── */
  document.getElementById('forgot-step1-form')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideAlert();
    const email = (document.getElementById('forgot-email')?.value || '').trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
      return showAlert('Please enter a valid email address.', 'error');
    setLoading('forgot-send-btn', 'forgot-spinner', 'forgot-send-text', true);
    try {
      const res = await authApiRequest('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showAlert(data.error || 'Could not send reset email. Please try again.', 'error');
        setLoading('forgot-send-btn', 'forgot-spinner', 'forgot-send-text', false);
        return;
      }
      showAlert('Reset code sent! Check your inbox.', 'success');
      setLoading('forgot-send-btn', 'forgot-spinner', 'forgot-send-text', false);
      document.getElementById('forgot-step1').style.display = 'none';
      document.getElementById('forgot-step2').style.display = 'block';
    } catch (err) {
      showAlert(err.message || 'Network error. Please try again.', 'error');
      setLoading('forgot-send-btn', 'forgot-spinner', 'forgot-send-text', false);
    }
  });

  /* ── Step 2: Update password ── */
  document.getElementById('forgot-step2-form')?.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideAlert();
    const code    = (document.getElementById('forgot-code')?.value || '').trim();
    const newPw   = (document.getElementById('forgot-new-password')?.value || '');
    const confirm = (document.getElementById('forgot-confirm-password')?.value || '');
    if (!code) return showAlert('Please enter the verification code.', 'error');
    if (newPw.length < 6) return showAlert('Password must be at least 6 characters.', 'error');
    if (newPw !== confirm) return showAlert('Passwords do not match.', 'error');
    setLoading('forgot-submit-btn', 'forgot-submit-spinner', 'forgot-submit-text', true);
    try {
      const res = await authApiRequest('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, newPassword: newPw })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showAlert(data.error || 'Could not reset password. Please try again.', 'error');
        setLoading('forgot-submit-btn', 'forgot-submit-spinner', 'forgot-submit-text', false);
        return;
      }
      showAlert('Password updated! Redirecting to login…', 'success');
      setTimeout(function() {
        if (window.app && window.app.router) window.app.router.navigate('/login');
        else window.location.href = '/login';
      }, 1200);
    } catch (err) {
      showAlert(err.message || 'Network error. Please try again.', 'error');
      setLoading('forgot-submit-btn', 'forgot-submit-spinner', 'forgot-submit-text', false);
    }
  });

  /* ── Resend / change email ── */
  document.getElementById('forgot-resend-btn')?.addEventListener('click', function() {
    hideAlert();
    document.getElementById('forgot-step2').style.display = 'none';
    document.getElementById('forgot-step1').style.display = 'block';
  });
})();
</script>
</body>
</html>
