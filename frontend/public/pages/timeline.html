<div class="page active" id="timeline">
    <!-- Mobile Header (screens < 768px) -->
    <header class="mobile-header">
      <button type="button" class="hamburger-btn" id="hamburger-toggle" aria-label="Toggle navigation" style="background: none; border: none; color: white; font-size: 28px; cursor: pointer; line-height:1;">
        &#9776;
      </button>
      <img src="/assets/images/logo.png" alt="STREAKO logo" style="height: 36px; width: 36px; object-fit: contain; background: transparent;">
      <div class="mobile-header-brand">
        <span>STREAKO</span>
        <span>Premium Productivity</span>
      </div>
    </header>

    <div class="overlay" id="sidebar-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 998;"></div>

    <div class="sidebar-layout">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="sidebar-logo" onclick="app.router.navigate('/dashboard')">
                <div class="sidebar-logo-icon">
                    <img src="/assets/images/logo.png" alt="STREAKO Logo">
                </div>
                <div class="sidebar-logo-text">
                    <span class="sidebar-logo-title">STREAKO</span>
                    <span class="sidebar-logo-sub">PREMIUM PRODUCTIVITY</span>
                </div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-item " onclick="app.router.navigate('/dashboard')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
                    <span>Today</span>
                </div>
                <div class="nav-item " onclick="app.router.navigate('/habits-library')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    <span>Habits</span>
                </div>
                <div class="nav-item active" onclick="app.router.navigate('/timeline')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></svg>
                    <span>Planner</span>
                </div>
                <div class="nav-item " onclick="app.router.navigate('/calendar')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                    <span>Calendar</span>
                </div>
                <div class="nav-item " onclick="app.router.navigate('/goals')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
                    <span>Goals</span>
                </div>
                <div class="nav-item " onclick="app.router.navigate('/analytics')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
                    <span>Analytics</span>
                </div>
                <div class="nav-item " onclick="app.router.navigate('/journal')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span>Journal</span>
                </div>
                <div class="nav-item " onclick="app.router.navigate('/settings')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </div>
            </div>
            <div class="sidebar-profile">
                <div class="profile-avatar" id="sidebar-avatar">AG</div>
                <div class="profile-info" onclick="app.router.navigate('/settings')">
                    <p id="sidebar-name">User</p>
                    <p id="sidebar-email">user@email.com</p>
                </div>
                <button type="button" class="profile-action-btn" onclick="window.logout()" title="Log Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content" style="padding: 32px 36px; background: #07080a; min-height: 100vh;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start;">
                
                <!-- Left Panel: Today's Task Board -->
                <div style="background: #0d0e14; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; min-height: 540px; display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
                            <h2 style="font-size: 18px; font-weight: 700; color: #ffffff; margin: 0;">Today's Task Board</h2>
                        </div>
                        <button type="button" id="btn-create-task" onclick="window.startAddingTask()" style="background: rgba(255,255,255,0.06); color: #ffffff; border: 1px solid rgba(255,255,255,0.12); padding: 7px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.06)'">
                            + Create Task
                        </button>
                    </div>

                    <!-- Task Board Container -->
                    <div id="planner-tasks-container" style="flex: 1; display: flex; flex-direction: column;">
                        <!-- Dynamically populated by window.renderPlannerTasks() -->
                    </div>
                </div>

                <!-- Right Panel: Time Blocking Planner -->
                <div style="background: #0d0e14; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px; padding: 24px; min-height: 540px; display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                        <div>
                            <h2 style="font-size: 18px; font-weight: 700; color: #ffffff; margin: 0 0 4px 0;">Time Blocking Planner</h2>
                            <p style="font-size: 12.5px; color: #64748b; margin: 0;">Drag to move, pull bottom handle to resize blocks.</p>
                        </div>
                        <button type="button" onclick="window.openTimeBlockModal()" style="display: flex; align-items: center; gap: 6px; background: #4f46e5; color: #ffffff; border: none; padding: 9px 18px; border-radius: 9999px; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#4338ca'" onmouseout="this.style.background='#4f46e5'">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Add Block
                        </button>
                    </div>

                    <!-- Timeline Scrollable View -->
                    <div id="timeline-grid-container" style="flex: 1; overflow-y: auto; max-height: 580px; padding-right: 6px; scrollbar-width: thin;">
                        <!-- Dynamically populated by window.renderTimelineGrid() -->
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Modal Overlay for Creating Time Block -->
<div id="timeblock-modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: #12141c; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; width: 100%; max-width: 440px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
        <div style="padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; background: #181b26;">
            <h3 id="timeblock-modal-title" style="margin: 0; font-size: 16.5px; font-weight: 700; color: #ffffff;">Add Time Block</h3>
            <button type="button" onclick="window.closeTimeBlockModal()" style="background: transparent; border: none; color: #64748b; font-size: 18px; cursor: pointer;">✕</button>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label style="display: block; font-size: 12.5px; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">Title *</label>
                <input type="text" id="tb-title" placeholder="e.g. Deep Work Session" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0c0d12; color: #fff; font-size: 14px; outline: none; box-sizing: border-box;" />
            </div>
            <div style="display: flex; gap: 12px;">
                <div style="flex: 1;">
                    <label style="display: block; font-size: 12.5px; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">Start Time</label>
                    <input type="time" id="tb-start" value="09:00" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0c0d12; color: #fff; font-size: 14px; outline: none; box-sizing: border-box;" />
                </div>
                <div style="flex: 1;">
                    <label style="display: block; font-size: 12.5px; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">End Time</label>
                    <input type="time" id="tb-end" value="10:00" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0c0d12; color: #fff; font-size: 14px; outline: none; box-sizing: border-box;" />
                </div>
            </div>
            <div>
                <label style="display: block; font-size: 12.5px; font-weight: 600; color: #94a3b8; margin-bottom: 6px;">Category / Color</label>
                <select id="tb-category" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0c0d12; color: #fff; font-size: 14px; outline: none; box-sizing: border-box;">
                    <option value="#6366f1">💼 Work / Career</option>
                    <option value="#ef4444">💪 Fitness / Workout</option>
                    <option value="#10b981">🧘 Mindfulness / Health</option>
                    <option value="#3b82f6">📚 Learning / Study</option>
                    <option value="#ec4899">✍️ Personal / Reflection</option>
                    <option value="#f59e0b">✨ Productivity</option>
                </select>
            </div>
        </div>
        <div style="padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: flex-end; gap: 10px; background: #181b26;">
            <button type="button" onclick="window.closeTimeBlockModal()" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #cbd5e1; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13.5px;">Cancel</button>
            <button type="button" onclick="window.saveTimeBlock()" style="background: #4f46e5; border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 700;">Save Block</button>
        </div>
    </div>
</div>
