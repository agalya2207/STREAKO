<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authenticating with Google | STREAKO</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f9fafb;
      color: #111827;
    }
    .cb-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e5e7eb;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .cb-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #10B981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .cb-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    .cb-desc {
      font-size: 14px;
      color: #6b7280;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="cb-card">
    <div class="cb-spinner"></div>
    <h2 class="cb-title">Authenticating with Google...</h2>
    <p class="cb-desc">Completing your sign-in to STREAKO.</p>
  </div>

  <script>
    (async function() {
      try {
        // 1. Check URL hash (Supabase default)
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash || window.location.search);
        
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        const expiresAt = params.get('expires_at');

        if (accessToken) {
          localStorage.setItem('access_token', accessToken);
          localStorage.setItem('streako_auth_token', accessToken);
          if (refreshToken) localStorage.setItem('refresh_token', refreshToken);
          if (expiresAt) localStorage.setItem('expires_at', expiresAt);

          // Fetch user profile from /api/auth/me
          try {
            const meRes = await fetch('/api/auth/me', {
              headers: { 'Authorization': 'Bearer ' + accessToken }
            });
            if (meRes.ok) {
              const meData = await meRes.json();
              if (meData.user) {
                localStorage.setItem('user', JSON.stringify(meData.user));
                localStorage.setItem('streako_user', JSON.stringify(meData.user));
                if (meData.user.id) localStorage.setItem('user_id', meData.user.id);
                if (meData.user.email) localStorage.setItem('user_email', meData.user.email);
              }
            }
          } catch (e) {
            console.warn('Could not fetch user details:', e);
          }

          if (window.app && window.app.router) {
            window.app.router.navigate('/dashboard');
          } else {
            window.location.href = '/dashboard';
          }
          return;
        }

        // 2. Check for error in query or hash
        const errorDesc = params.get('error_description') || params.get('error');
        if (errorDesc) {
          console.error('Google Auth Error:', errorDesc);
          alert('Google Sign-In Error: ' + errorDesc);
          window.location.href = '/login';
          return;
        }

        // Fallback: If no tokens found, return to login
        setTimeout(function() {
          window.location.href = '/login';
        }, 1200);
      } catch (err) {
        console.error('Callback error:', err);
        window.location.href = '/login';
      }
    })();
  </script>
</body>
</html>
